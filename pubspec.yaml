name: academy
description: Menai Muttineers Pre-Flyball Academy - Android and Web V1.4
publish_to: 'none'
version: 1.4.2+20
environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: 4.12.1
  # Keep the Dart Pigeon schema matched to firebase_core 4.12.1's Android code.
  # Newer 8.1.x removed a CoreFirebaseOptions field and is not wire-compatible
  # with the 4.12.1 Android generated host API.
  firebase_core_platform_interface: 8.0.0
  # 3.10.x requires platform_interface 8.1.x, so keep the matching web peer too.
  firebase_core_web: 3.9.1
  firebase_auth: 6.5.6
  # Keep Firebase Auth's Dart Pigeon client matched to firebase_auth 6.5.6.
  firebase_auth_platform_interface: 9.0.5
  firebase_auth_web: 6.2.5
  cloud_firestore: 6.7.1
  firebase_messaging: 16.4.3
  firebase_storage: 13.4.5
  cloud_functions: 6.3.5
  image_picker: ^1.2.3
  crypto: ^3.0.6
  url_launcher: ^6.3.2
  youtube_player_iframe: ^6.0.2
  video_player: ^2.10.0
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  shared_preferences: ^2.5.3
  speech_to_text: 7.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/trophy_chime.wav
    - assets/sounds/ship_bell.wav
    - assets/sounds/parrot_squawk.wav
    - assets/sounds/tiny_cannon.wav
    - assets/sounds/aww_chime.wav
    - assets/music/gentle_tide_1.mp3
    - assets/music/gentle_tide_2.mp3
