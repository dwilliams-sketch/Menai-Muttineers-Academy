name: Build Academy APK and Web

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android and Web platform files
        run: |
          rm -rf platform_template android web
          flutter create --platforms=android,web --org com.menaimuttineers --project-name academy platform_template
          cp -R platform_template/android ./android
          cp -R platform_template/web ./web
          rm -rf platform_template
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="academy"', 'android:label="Menai Muttineers Academy"')
          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '>\n    <application',
                  '>\n'
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                  '    <uses-permission android:name="android.permission.VIBRATE"/>\n'
                  '    <application',
                  1,
              )
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              g = gradle.read_text()
              g = g.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(g)

          index = Path('web/index.html')
          text = index.read_text().replace(
              '<title>academy</title>',
              '<title>Menai Muttineers Academy</title>',
          )
          index.write_text(text)

          m = Path('web/manifest.json')
          text = (
              m.read_text()
              .replace('"name": "academy"', '"name": "Menai Muttineers Academy"')
              .replace('"short_name": "academy"', '"short_name": "Muttineers Academy"')
          )
          m.write_text(text)
          PY

          # Force Android plugin registration on the FlutterEngine.
          # The APK contains FlutterFirebaseCorePlugin, but the installed app is
          # currently reaching Firebase before a native host channel is attached.
          cat > android/app/src/main/kotlin/com/menaimuttineers/academy/MainActivity.kt <<'KOTLIN'
          package com.menaimuttineers.academy

          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import io.flutter.plugins.GeneratedPluginRegistrant
          import io.flutter.plugins.firebase.core.FlutterFirebaseCorePlugin
          import io.flutter.plugins.firebase.auth.FlutterFirebaseAuthPlugin

          class MainActivity : FlutterActivity() {
              private var manualFirebaseCoreCompleted = false
              private var manualFirebaseCoreError: String? = null
              private var firebaseCoreListed = false
              private var manualFirebaseAuthCompleted = false
              private var manualFirebaseAuthError: String? = null
              private var firebaseAuthListed = false
              private var generatedRegistrantCompleted = false
              private var generatedRegistrantError: String? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  // Register Firebase Core FIRST and capture the real Android
                  // exception if its onAttachedToEngine() fails. Flutter's plugin
                  // registry stores a plugin before calling onAttachedToEngine(),
                  // so merely seeing the plugin in GeneratedPluginRegistrant is
                  // not proof that its Pigeon channels attached successfully.
                  try {
                      flutterEngine.plugins.add(FlutterFirebaseCorePlugin())
                      manualFirebaseCoreCompleted = true
                  } catch (t: Throwable) {
                      manualFirebaseCoreError = t.stackTraceToString()
                  }

                  firebaseCoreListed =
                      flutterEngine.plugins.has(FlutterFirebaseCorePlugin::class.java)

                  // Register Firebase Auth explicitly as well. The login and
                  // password-reset Futures are currently waiting forever, which
                  // is what happens when Auth's Pigeon host channels are absent.
                  try {
                      flutterEngine.plugins.add(FlutterFirebaseAuthPlugin())
                      manualFirebaseAuthCompleted = true
                  } catch (t: Throwable) {
                      manualFirebaseAuthError = t.stackTraceToString()
                  }

                  firebaseAuthListed =
                      flutterEngine.plugins.has(FlutterFirebaseAuthPlugin::class.java)

                  // Register every other generated plugin. Core/Auth will be
                  // skipped as already present when their explicit registration worked.
                  try {
                      GeneratedPluginRegistrant.registerWith(flutterEngine)
                      generatedRegistrantCompleted = true
                  } catch (t: Throwable) {
                      generatedRegistrantError = t.stackTraceToString()
                  }

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      "academy/startup_diagnostics"
                  ).setMethodCallHandler { call, result ->
                      if (call.method == "getStartupDiagnostics") {
                          result.success(
                              mapOf(
                                  "manualFirebaseCoreCompleted" to manualFirebaseCoreCompleted,
                                  "manualFirebaseCoreError" to manualFirebaseCoreError,
                                  "firebaseCoreListed" to firebaseCoreListed,
                                  "manualFirebaseAuthCompleted" to manualFirebaseAuthCompleted,
                                  "manualFirebaseAuthError" to manualFirebaseAuthError,
                                  "firebaseAuthListed" to firebaseAuthListed,
                                  "generatedRegistrantCompleted" to generatedRegistrantCompleted,
                                  "generatedRegistrantError" to generatedRegistrantError
                              )
                          )
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KOTLIN

      - name: Show Android startup wiring
        run: |
          echo "=== MainActivity ==="
          cat android/app/src/main/kotlin/com/menaimuttineers/academy/MainActivity.kt
          echo "=== Manifest activity ==="
          grep -n "MainActivity" android/app/src/main/AndroidManifest.xml || true

      - name: Apply Menai Muttineers app icons
        run: |
          cp branding/android/mipmap-mdpi/ic_launcher.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp branding/android/mipmap-hdpi/ic_launcher.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp branding/android/mipmap-xhdpi/ic_launcher.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp branding/android/mipmap-xxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp branding/android/mipmap-xxxhdpi/ic_launcher.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp branding/web/favicon.png web/favicon.png
          cp branding/web/icons/Icon-192.png web/icons/Icon-192.png
          cp branding/web/icons/Icon-512.png web/icons/Icon-512.png
          cp branding/web/icons/Icon-maskable-192.png web/icons/Icon-maskable-192.png
          cp branding/web/icons/Icon-maskable-512.png web/icons/Icon-maskable-512.png

      - name: Get Flutter packages
        run: |
          flutter clean
          flutter pub get
          echo "=== Resolved Firebase Core + Auth compatibility set ==="
          flutter pub deps --style=compact | grep -E "firebase_core($| )|firebase_core_platform_interface|firebase_core_web|firebase_auth($| )|firebase_auth_platform_interface|firebase_auth_web" || true
          python3 - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('.dart_tool/package_config.json').read_text())
          roots = {p['name']: p['rootUri'] for p in cfg['packages']}

          expected = {
              'firebase_core': 'firebase_core-4.12.1',
              'firebase_core_platform_interface': 'firebase_core_platform_interface-8.0.0',
              'firebase_core_web': 'firebase_core_web-3.9.1',
              'firebase_auth': 'firebase_auth-6.5.6',
              'firebase_auth_platform_interface': 'firebase_auth_platform_interface-9.0.5',
              'firebase_auth_web': 'firebase_auth_web-6.2.5',
          }

          for name, marker in expected.items():
              root = roots.get(name, '')
              print(f"{name}: {root}")
              if marker not in root:
                  raise SystemExit(
                      f"Wrong {name} resolved. Expected {marker}, got {root}"
                  )

          print("Firebase Core + Auth Dart/native compatibility check: PASS")
          PY

      - name: Build installable Android APK
        run: |
          flutter build apk --debug \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Show Android plugin registrant
        if: always()
        run: |
          echo "Flutter generated plugin registrants:"
          find android build -name GeneratedPluginRegistrant.java -print 2>/dev/null || true
          grep -R -E "FlutterFirebaseCorePlugin|FlutterFirebaseAuthPlugin" android build -n 2>/dev/null | head -40 || true

      - name: Give APK a friendly name
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/Menai-Muttineers-Academy-V1.3.7.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Menai-Muttineers-Academy-V1-3-7-APK
          path: build/app/outputs/flutter-apk/Menai-Muttineers-Academy-V1.3.7.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build Web App
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          flutter build web --release --base-href "/" \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_WEB_APP_ID=${{ secrets.FIREBASE_WEB_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Upload Web build backup
        uses: actions/upload-artifact@v4
        with:
          name: Menai-Muttineers-Academy-V1-3-7-Web
          path: build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages package
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-web:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish Web App
        id: deployment
        uses: actions/deploy-pages@v4
